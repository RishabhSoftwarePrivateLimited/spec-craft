name: ci

# Manual-only for now (see ci-automation.md) — switch back to `pull_request:` +
# `push: { branches: [main] }` when ready to run CI automatically again.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  maintainers-domain-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every MAINTAINERS.md email must be @rishabhsoft.com
        run: |
          bad=$(grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+' MAINTAINERS.md | grep -v '@rishabhsoft\.com$' || true)
          if [ -n "$bad" ]; then
            echo "Non-@rishabhsoft.com email(s) found in MAINTAINERS.md:"
            echo "$bad"
            exit 1
          fi
