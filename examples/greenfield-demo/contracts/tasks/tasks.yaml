openapi: 3.1.0
info:
  title: Task Tracker API — tasks module
  version: 1.0.0
  description: >
    REST/JSON API for the `tasks` resource (AD-BACKEND-004). Backed by an
    in-memory, single-process repository — no persistence across restarts
    by design (AD-BACKEND-002). No auth (AD-BACKEND-003).
servers:
  - url: http://localhost:4000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: List all tasks, newest-first
      responses:
        '200':
          description: >
            Current tasks, newest-first (ordering guaranteed by repository
            insertion order, not a separate sort step).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Blank or whitespace-only title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Task:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp, server-assigned.
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Rejected if empty or whitespace-only after trimming.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Title is required
